services:
  mysql:
    image: mysql:8.0
    container_name: isp_mysql
    environment:
      MYSQL_ROOT_PASSWORD: RootP@ssw0rd2026!
      MYSQL_DATABASE: isp_system
      MYSQL_USER: isp_user
      MYSQL_PASSWORD: SecureP@ssw0rd2026!
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - isp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

    radius:
    build:
      context: ./radius
      dockerfile: Dockerfile
    container_name: isp_radius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    networks:
      - isp_network
    depends_on:
      - mysql
    restart: unless-stopped

  radius:
    image: freeradius/freeradius-server:latest
    container_name: isp_radius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    networks:
      - isp_network
    restart: unless-stopped

  mikrotik:
    image: alpine:latest
    container_name: isp_mikrotik
    command: sleep infinity
    network_mode: "host"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isp_backend
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      radius:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=isp_system;User=root;Password=RootP@ssw0rd2026!
      - ConnectionStrings__RadiusConnection=Server=mysql;Port=3306;Database=isp_system;User=root;Password=RootP@ssw0rd2026!
      - Redis__ConnectionString=redis:6379
      - RadiusServer__Host=isp_radius
      - RadiusServer__Port=1812
      - RadiusServer__Secret=testing123
      - MikroTik__Ip=192.168.88.1
      - MikroTik__User=admin
      - MikroTik__Pass=sham@#$
      - MikroTik__ApiPort=8728
      - MikroTik__Enabled=true
      # 1. Force a securely sized JWT Key to prevent crypto signing crashes
      - Jwt__Key=SuperSecureSecretKeyForISPSystem2026WithMoreThan256BitsOfLength!
      - Jwt__Issuer=ISPSystem
      - Jwt__Audience=ISPSystemFrontend
      # 2. Turn up log verbosity to expose hidden database or framework issues
      - Logging__LogLevel__Default=Debug
      - Logging__LogLevel__Microsoft.AspNetCore=Information
  
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    networks:
      - isp_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: isp_frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - isp_network
    restart: unless-stopped

networks:
  isp_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  dataprotection_keys:
